[package]
name = "copy-pasta"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Atuin for your clipboard — instant, searchable, context-aware paste history"
license = "MIT"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/copy-pasta"
publish = false

[[bin]]
name = "copy-pasta"
path = "src/main.rs"

[dependencies]
arboard = { version = "3", features = ["image-data"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
fuzzy-matcher = "0.3"
global-hotkey = "0.8"
gpui = { git = "https://github.com/zed-industries/zed", rev = "3ce72bab201ad82418fc9716aad11332624951bc" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "3ce72bab201ad82418fc9716aad11332624951bc", features = ["font-kit"] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSPasteboard",
    "NSRunningApplication",
    "NSWorkspace",
    "libc",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "NSObject",
    "NSString",
] }
core-graphics = { version = "0.25", features = ["elcapitan"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
unicode-segmentation = "1.12"
url = "2"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2", features = ["json"] }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
